<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- The app resolves its icons relative to the document, so the base has to be
     the site root even though this page lives under /tests/browser/. -->
<base href="/">
<title>loading</title>
<link rel="icon" href="assets/icons/app_logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"></div>
  <script type="module">
    // Seeded page for the browser suites: it puts the app into a known state
    // without going through the system file picker.
    //
    //   ?seed=plain      categories only (the default)
    //   ?seed=exercises  four exercises, two images each
    //   ?seed=text       three exercises chosen to stress text clipping
    //   &extras          turn on the indicator and favourites columns
    //   &popup=N         open the exercise popup with N generated images
    //   &complexes=2,1,1 build complexes of these sizes from the seeded rows
    //   &off=1           switch complex #1 (0-based) out of the schedule
    //   &multi           seed a second category with its own complexes, so the
    //                    calendar has more than one category on a day
    //   &start=today     schedule every category from today, so the workout
    //                    page - which only ever looks at today, tomorrow and
    //                    the day after - has something to show
    //   &rows=N          repeat the seeded exercises up to N rows, numbered, so
    //                    Exercise_list is long enough to scroll
    //   &images=N        seed N images per exercise instead of two, which is
    //                    how the exercise page's sheet of every image gets one,
    //                    a pair and a grid to lay out
    //   &page=calendar   open on that page instead of the schedule
    //   &page=exercise   start the active category's first complex and open the
    //                    exercise page on it. Needs &start=today, since only
    //                    today's complexes can be started.
    import {
      resetStore, addExercise, setUiFlag, activeCategory,
      createComplexFromExercises, setComplexEnabled, setActiveCategory, getState,
    } from '/js/store.js';
    import { toIsoDate, startOfDay } from '/js/schedule.js';
    import { mountApp, goToPage } from '/js/app.js';
    import { startComplex, resetExerciseState } from '/js/exercise-page.js';
    import { openExerciseModal } from '/js/exercise-modal.js';
    import { createExercise } from '/js/model.js';

    const params = new URLSearchParams(location.search);
    const seed = params.get('seed') || 'plain';
    const COLORS = ['#8a2b2b', '#2b5f8a', '#2b8a4f', '#8a7a2b'];

    function makeImage(label, color) {
      const canvas = document.createElement('canvas');
      canvas.width = 520;
      canvas.height = 290;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = color;
      ctx.fillRect(0, 0, 520, 290);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 64px sans-serif';
      ctx.fillText(label, 30, 175);
      return new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.8));
    }

    const EXERCISES = [
      ['Отведение ноги на боку', 'Среднеягодичная мышца. Поясничный замок – максимально прижимаем к себе нижнюю ногу. Поясница неподвижна.'],
      ['Круговое движение прямой ноги на боку (велосипед)', 'Среднеягодичная мышца. Поясничный замок – максимально прижимаем к себе нижнюю ногу. Избегать избыточного включения мышц задней поверхности бедра.'],
      ['Скручивание ТБС и колена сидя', 'Ягодицы, мобильность. Опора на согнутую руку. Сначала внутренняя ротация колена, потом скручивания ТБС нижней ноги.'],
      ['Наклоны вперёд сидя с согнутыми ногами', 'Ягодицы, мобильность. Колени под 90 град. Наклоняемся, протягивая руку вдоль пола.'],
    ];

    // Deliberately awkward text: a title too long for one line, and capitals
    // whose diacritics sit above cap height (Й, Ё) with descenders below.
    const TEXT_CASES = [
      ['Короткое', 'Ягодицы, мобильность. Колени под 90 град.'],
      ['Круговое движение прямой ноги на боку (велосипед) с очень длинным названием которое точно не поместится в одну строку',
       'ЙЦУКЕН ЩЁРТ. Среднеягодичная мышца. Поясничный замок – максимально прижимаем к себе нижнюю ногу. Поясница неподвижна. Избегать избыточного включения мышц задней поверхности бедра. Всё движение только в ТБС и никак иначе, это очень длинное описание.'],
      ['ЙЁЩЪ Заглавные буквы',
       'ЙЁЩЪ ВЕРХНИЕ ЗАГЛАВНЫЕ БУКВЫ первая строка. Вторая строка тоже есть. Третья строка не должна отображаться совсем никак. Четвёртая тем более.'],
    ];

    // resetStore, not initStore: the suites must never reach the network. And
    // resetExerciseState, because a session is module state that a reload of
    // this page does not by itself clear.
    resetStore();
    resetExerciseState();

    if (seed === 'exercises' || seed === 'text') {
      const rows = seed === 'text' ? TEXT_CASES : EXERCISES;
      const count = Number(params.get('images')) || (seed === 'text' ? 1 : 2);
      // &rows cycles the definitions above until there are that many, and
      // numbers the names so each row is still recognisable. Without it the
      // seed is exactly as it was, because suites assert on these names.
      const many = Number(params.get('rows')) || 0;
      const total = many || rows.length;
      for (let i = 0; i < total; i += 1) {
        const source = rows[i % rows.length];
        const images = [];
        for (let n = 0; n < count; n += 1) {
          images.push(await makeImage(
            n === 0 ? String(i + 1) : String.fromCharCode(97 + n),
            COLORS[(i + n) % COLORS.length]));
        }
        addExercise(createExercise({
          name: source[0] + (many ? ' ' + (i + 1) : ''),
          description: source[1],
          images,
          equipment: ['mat'],
        }));
      }
    }

    // Complexes are built from the exercises just seeded, taken in order and cut
    // into runs of the requested sizes.
    if (params.has('complexes')) {
      const sizes = params.get('complexes').split(',').map(Number).filter((n) => n > 0);
      const ids = activeCategory().exercises.map((e) => e.id);
      let at = 0;
      for (const size of sizes) {
        const slice = ids.slice(at, at + size);
        at += size;
        if (slice.length) {
          createComplexFromExercises(slice, activeCategory().complexes.length);
        }
      }
      for (const index of (params.get('off') || '').split(',').filter(Boolean)) {
        const complex = activeCategory().complexes[Number(index)];
        if (complex) setComplexEnabled(complex.id, false);
      }
    }

    // A second category on the same dates, so a calendar day has two tabs.
    if (params.has('multi')) {
      const home = getState().ui.activeCategory;
      const other = getState().categoryOrder.find((id) => id !== home);
      setActiveCategory(other);

      const NAMES = ['Приседания у стены', 'Разгибание колена сидя'];
      for (let i = 0; i < NAMES.length; i += 1) {
        addExercise(createExercise({
          name: NAMES[i],
          description: 'Второй категории упражнение ' + (i + 1) + '.',
          images: [await makeImage('K' + (i + 1), COLORS[(i + 2) % COLORS.length])],
          equipment: ['mat'],
        }));
      }
      for (const exercise of activeCategory().exercises) {
        createComplexFromExercises([exercise.id], activeCategory().complexes.length);
      }
      setActiveCategory(home);
    }

    // Every category's default start date is 3 сен, which is in the past for
    // most of the year. Moving it to today puts complexes on today, tomorrow
    // and the day after - the only three days the workout page ever shows.
    if (params.get('start') === 'today') {
      const today = toIsoDate(startOfDay());
      for (const id of getState().categoryOrder) {
        getState().categories[id].scheduleStartDate = today;
      }
    }

    if (params.has('extras')) {
      setUiFlag('showIndicators', true);
      setUiFlag('showFavorites', true);
    }

    mountApp(document.getElementById('app'));

    // The exercise page cannot be reached by naming it: it is half of a session,
    // so the harness starts a complex the way Начать does and then goes there.
    if (params.get('page') === 'exercise') {
      const complex = activeCategory().complexes[0];
      if (complex && startComplex(getState().ui.activeCategory, complex.id)) {
        goToPage('exercise');
      }
    } else if (params.get('page')) {
      goToPage(params.get('page'));
    }

    if (params.has('popup')) {
      const count = Number(params.get('popup')) || 1;
      const images = [];
      for (let i = 0; i < count; i += 1) {
        images.push(await makeImage(String(i + 1), COLORS[i % COLORS.length]));
      }
      openExerciseModal({ images, defaultEquipment: ['mat'], onSubmit: () => {} });
      document.querySelector('.input--text').value = 'Скручивание ТБС и колена сидя';
      document.querySelector('.input--textarea').value =
        'Ягодицы, мобильность. Опора на согнутую руку. Сначала внутренняя ротация колена, потом скручивания ТБС нижней ноги, рукой можно доводить ногу до крайнего положения.';
    }

    document.title = 'ready';
  </script>
</body>
</html>
